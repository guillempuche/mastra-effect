name: Release

# Only from a tag on the default branch, or by hand. Never on `pull_request` —
# this workflow is the one place with publish rights, so untrusted code must not
# be able to reach it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    # A GitHub environment with a required reviewer puts a human between a pushed
    # tag and a published version, and npm's trusted publisher can be scoped to
    # this environment specifically.
    environment: release

    permissions:
      contents: read
      # The whole point: mint a short-lived OIDC token so npm can verify this
      # build's identity. There is no NPM_TOKEN in this repository, so there is
      # no long-lived credential to steal — and npm no longer offers classic
      # tokens anyway.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Deliberately no `cache: pnpm` here. A cache entry written by an earlier
      # unprivileged run is attacker-influenced input, and this is the one job
      # where that matters. A cold install costs a minute.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Pack
        run: pnpm pack --pack-destination /tmp

      # pnpm's own publish has delegated the OIDC exchange to the npm CLI
      # historically, and that path has been reported broken on pnpm 11. Packing
      # with pnpm and publishing the tarball with npm keeps the trusted-publishing
      # flow on the tool that owns it.
      #
      # --provenance is implied by trusted publishing; consumers can verify the
      # result with `npm audit signatures`.
      - name: Publish
        run: |
          set -euo pipefail
          tarball=$(find /tmp -maxdepth 1 -name '*.tgz' | head -1)
          echo "publishing $tarball"
          npm publish "$tarball" --access public

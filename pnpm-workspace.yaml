# pnpm reads its settings from here, not from .npmrc — only auth and registry
# settings still come from .npmrc.

# The examples are real members of this workspace. Left out, `pnpm install` inside one of them
# resolves to the root workspace, reports "Already up to date" and installs nothing — so its
# dependencies are simply absent and every import fails to resolve.
packages:
  - examples/*

# Recursive runs (`pnpm -r test`) go one package at a time. Each example builds the library before
# it runs, so that it works on a fresh clone, and each build leaves dist/ without its type
# declarations for about 400ms. In parallel, an example type-checked inside that window fails with
# "Cannot find module '@guillem_puche/mastra-effect'". Rare — once in 14 parallel runs when
# measured — but a red CI run for no reason costs more than the seconds this adds.
# Set here rather than as a flag, because a flag someone forgets brings the race back silently.
workspaceConcurrency: 1

# Deny every dependency lifecycle script. An install-time script is the primary
# malware vector in a compromised release, and auditing this tree found that
# only lefthook and protobufjs declare install, preinstall or postinstall — so the
# allowlist allows one and names the other as denied, by evidence rather than by optimism.
#
# If a future dependency genuinely needs to build, pnpm will say so: add that one
# package here rather than reaching for dangerouslyAllowAllBuilds.
allowBuilds:
  # lefthook ships a Go binary and its install script fetches/links the build for
  # this platform, so it cannot work without one. Allowed deliberately, as a
  # named exception — which is the whole point of an allowlist over a blanket
  # permit. It is a devDependency and never reaches a consumer of this package.
  lefthook: true
  # Denied, but named so pnpm stops asking. Its postinstall only prints a warning about version
  # schemes, and nothing here needs it. It arrives with @mastra/otel-bridge, through the gRPC
  # exporters @mastra/otel-exporter depends on, and only in examples/full-app.
  protobufjs: false

# Refuse to resolve a version published less than a day ago. A compromised
# release is typically caught and unpublished within hours, so the delay is the
# window that catches it.
#
# The cost is real here: this repo tracks `rc` and `alpha` dist-tags, so the very
# newest upstream build is briefly unavailable. That is the intended trade.
# Renovate is configured with a longer window still, so it never opens a PR for a
# version pnpm would then refuse to install.
minimumReleaseAge: 1440

# The Mastra packages are exempt. This adapter exists to track their release line, its
# conformance suite is theirs and runs on every test run, and they publish continuously — so the
# newest version that has aged in is frequently a prerelease. Left gated, a range honest enough
# to say `^1.68.0` cannot resolve at all for a day after each release, and the tempting fix is a
# prerelease floor that silently resolves to an alpha with no warning at all. The quiet period
# earns its keep against long-tail transitive dependencies, not against the one package this is
# built on and exhaustively tested against.
minimumReleaseAgeExclude:
  - '@mastra/*'

# Mastra's conformance suite declares `@mastra/mcp <2`, yet its MCP transport tests assert 2.x
# behaviour — a legacy SSE endpoint that answers 404, which only a 2.x server does — and the Mastra
# monorepo runs it against 2.x. So it runs against 2.x here too. This accepts exactly that pairing;
# every other peer mismatch still warns. 1.x servers are tested through the `@mastra/mcp-v1` alias.
# Remove this rule once the suite's range allows 2.x: https://github.com/mastra-ai/mastra/issues/24949
peerDependencyRules:
  allowedVersions:
    '@mastra/server-adapters-test-suite>@mastra/mcp': '2'
  # @mastra/otel-bridge lists the OpenTelemetry Node SDK and its auto-instrumentations as peers, but
  # only ever imports @opentelemetry/api and api-logs. full-app registers its own provider, so it
  # installs neither — they would add dozens of packages that never load.
  ignoreMissing:
    - '@opentelemetry/sdk-node'
    - '@opentelemetry/auto-instrumentations-node'

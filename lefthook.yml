# Fast checks on commit, slow ones on push. A pre-commit hook that takes longer
# than a thought gets bypassed with --no-verify, and a bypassed hook protects
# nothing.

pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: '*.{ts,tsx,js,mjs,cjs}'
      # The vendored Effect source is not ours to lint. Excluded here as well as in
      # .oxlintrc.json: a commit that touches only it would otherwise hand oxlint a
      # list of files it ignores, and oxlint fails on "No files found to lint".
      exclude:
        - 'docs/repos/**'
      # -c is required: without it oxlint discovers the vendored subtree's own
      # config under docs/repos and dies loading a plugin this repo lacks.
      run: pnpm exec oxlint -c .oxlintrc.json {staged_files}
      stage_fixed: true

    - name: typecheck
      glob: '*.ts'
      # Whole-project rather than per-file: a change in one file breaks types in
      # another, which is exactly the failure a staged-files check would miss.
      run: pnpm typecheck

    - name: dependency-versions
      # No glob. `**/package.json` silently skips a root-level package.json,
      # since `**/` wants at least one directory — and a hook that quietly never
      # runs is worse than one that is merely slow. syncpack takes 200ms.
      run: pnpm lint-deps

pre-push:
  # One at a time. The test and typecheck-examples jobs rebuild the library for each example, and
  # the build job rebuilds it too; each build briefly deletes dist/, so in parallel one job can
  # find it missing while another rebuilds it.
  parallel: false
  jobs:
    - name: typecheck
      # Pre-commit type-checks only when a .ts file is staged, so a change to tsconfig.json,
      # package.json or the lockfile — which can break types just as well — reaches here unchecked.
      run: pnpm typecheck

    - name: lint
      # The whole tree, not only the staged files pre-commit sees, as CI lints it.
      run: pnpm lint

    - name: vendored-effect
      # The one CI check with no other local equivalent; the script says why it matters.
      run: pnpm lint-vendor

    - name: secrets
      # This repository is public and publishes to npm, so a leaked credential is
      # leaked to everyone. GitHub's push protection catches known token formats
      # server-side; this runs before the push leaves the machine and also covers
      # patterns GitHub does not know about.
      run: pnpm lint-secrets

    - name: test
      # The library and every example. --include-workspace-root is required: pnpm excludes the
      # root project from -r by default, so `pnpm -r test` alone would run the examples' tests and
      # silently skip the library's — the opposite of what this hook is for.
      run: pnpm -r --include-workspace-root test

    - name: typecheck-examples
      # The pre-commit typecheck covers the library only, and vitest does not type-check, so an
      # example's files — its tests included — are checked nowhere else before CI. A type error in
      # an example's test once passed every hook this way and failed CI.
      run: pnpm -r --filter './examples/*' typecheck

    - name: build
      # Runs publint and are-the-types-wrong, so a broken exports map or a type
      # that will not resolve for a consumer is caught before it is pushed.
      run: pnpm build
